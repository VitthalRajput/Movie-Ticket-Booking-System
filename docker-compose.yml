version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: seatlock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seatlock_user
      POSTGRES_PASSWORD: seatlock_pass
      POSTGRES_DB: seatlock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: seatlock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: